<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Eventos</title>
    <script defer src="js/main.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Gestión de eventos</h1>
        <input id="inputFiltrar" type="text" placeholder="Buscar evento...">
    </header>
    <main>
        <section class="seccionFiltros">
            <button id="botonOrdenarFecha">Ordenar por fecha</button>
            
            <div>
                <label for="tipoDeEvento" class="tipoDeEvento">Filtrar por</label>
                <select name="tipo" id="tipoDeEvento" class="tipoDeEvento">
                    <option value="todos">Todos</option>
                    <option value="Charla">Charlas</option>
                    <option value="Workshop">Workshops</option>
                    <option value="Celebración">Celebraciones</option>
                </select>
            </div>
            
            <div>
                <label for="activoSiNo" class="activoSiNo">Activo</label>
                <select name="activo" id="activoSiNo" class="activoSiNo">
                    <option value="true">Si</option>
                    <option value="false">No</option>
                </select>
            </div>
        </section>
        <section >
            <!--seccion de cartas con descripciones-->
            <div id="contenedorEventos">
            </div>
        </section>
    </main>
    <footer>
        <p> - Candela Magali Corral - </p>
    </footer>
</body>
</html>
